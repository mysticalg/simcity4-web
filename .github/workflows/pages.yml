name: Deploy browser build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify game state
        run: |
          node tools/test-power.mjs
          node tools/test-imported-city.mjs
          node tools/test-water.mjs
          node tools/test-saved-utilities.mjs
          node tools/test-finance.mjs
          node tools/test-map-tools.mjs
          node tools/test-lot-development.mjs
      - name: Assemble browser files
        run: |
          mkdir -p _site
          cp index.html style.css app.mjs dbpf.mjs data-source.mjs bundled-assets.mjs regions.mjs game-data.mjs power.mjs city-state.mjs water.mjs finance.mjs map-tools.mjs terrain-renderer.mjs lot-development.mjs _site/
          cp -R vendor _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for uploaded files to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            artifact=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .id")
            if [ -n "$artifact" ]; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
